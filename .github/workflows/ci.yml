name: CI

on:
  push:
  pull_request:

jobs:
  # 主构建 + 单元/集成测试 + MCP Apps e2e（Windows/MinGW，与本地开发环境一致）
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 官方在线仓库最新稳定版（本地开发机 6.11.0 不在官方渠道，CI 用 6.9.3）
          version: '6.9.3'
          arch: 'win64_mingw'
          # 显式安装配套 MinGW 工具链：否则 cmake 会捡 runner 预装的 C:\mingw64，
          # 编译产物与 Qt DLL ABI 不匹配，运行时报 0xC0000139
          tools: 'tools_mingw1310'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$env:IQTA_TOOLS\mingw1310_64\bin\g++.exe" -DCMAKE_C_COMPILER="$env:IQTA_TOOLS\mingw1310_64\bin\gcc.exe"

      - name: Build tests_qt
        run: cmake --build build --target tests_qt -j 8

      - name: Run tests_qt
        shell: cmd
        run: |
          rem Qt bin 追加而非前置：工具链的 MinGW 运行时 DLL（libstdc++ 等）必须优先，
          rem 否则 Qt 包自带的旧版运行时会导致 0xC0000139 入口点未找到
          set PATH=%PATH%;%QT_ROOT_DIR%\bin
          build\build_test\tests_qt.exe
          echo EXITCODE=%ERRORLEVEL%

      - name: Build e2e
        run: cmake --build build --target tests_qt_apps_e2e -j 8

      # e2e 测试自带 node mock 服务器（test/mcp_apps_server.js，QProcess 拉起）
      - name: Run e2e
        run: |
          $env:PATH = $env:PATH + ";$env:QT_ROOT_DIR\bin"
          ./build/build_test/tests_qt_apps_e2e.exe

  # 官方 conformance 2026-07-28 客户端套件（draft + auth，发布门槛）
  conformance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 官方在线仓库最新稳定版（本地开发机 6.11.0 不在官方渠道，CI 用 6.9.3）
          version: '6.9.3'
          arch: 'win64_mingw'
          # 显式安装配套 MinGW 工具链：否则 cmake 会捡 runner 预装的 C:\mingw64，
          # 编译产物与 Qt DLL ABI 不匹配，运行时报 0xC0000139
          tools: 'tools_mingw1310'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$env:IQTA_TOOLS\mingw1310_64\bin\g++.exe" -DCMAKE_C_COMPILER="$env:IQTA_TOOLS\mingw1310_64\bin\gcc.exe"

      - name: Build conformance runner
        run: cmake --build build --target mcp_client_conformance_qt -j 8

      - name: Run draft suite
        run: |
          # Qt bin 追加而非前置：工具链 MinGW 运行时 DLL 必须优先（0xC0000139 防护）
          $env:PATH = $env:PATH + ";$env:QT_ROOT_DIR\bin"
          npx -y @modelcontextprotocol/conformance@0.2.0-alpha.10 client --command build\conformance_runner_qt\mcp_client_conformance_qt --suite draft

      - name: Run auth suite
        run: |
          $env:PATH = $env:PATH + ";$env:QT_ROOT_DIR\bin"
          npx -y @modelcontextprotocol/conformance@0.2.0-alpha.10 client --command build\conformance_runner_qt\mcp_client_conformance_qt --suite auth
